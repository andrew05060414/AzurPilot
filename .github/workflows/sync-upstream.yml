name: Sync AzurPilot upstream

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch AzurPilot and ALAS upstreams
        run: |
          git remote add azurpilot-upstream https://github.com/wess09/AzurPilot.git
          git remote add alas-upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch --no-tags azurpilot-upstream master
          git fetch --no-tags alas-upstream master

      - name: Check whether ALAS is ahead
        run: |
          ahead=$(git rev-list --count --right-only --cherry-pick azurpilot-upstream/master...alas-upstream/master)
          {
            echo '## Upstream status'
            echo "- AzurPilot source: \`$(git rev-parse --short azurpilot-upstream/master)\`"
            echo "- ALAS source: \`$(git rev-parse --short alas-upstream/master)\`"
            echo "- ALAS patches not represented by AzurPilot: \`$ahead\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ahead" -gt 0 ]; then
            echo "::warning::ALAS has $ahead patch-equivalent commit(s) not represented by AzurPilot; no direct ALAS merge was performed."
          fi

      - name: Merge AzurPilot upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep the personal Electron shell when upstream removes or changes it.
          if git merge --no-edit -X ours azurpilot-upstream/master; then
            :
          else
            git checkout --ours -- \
              webapp/package.json \
              webapp/pnpm-workspace.yaml \
              webapp/tsconfig.json \
              webapp/types/vite-env.d.ts \
              webapp/packages/renderer/index.html \
              webapp/packages/renderer/tsconfig.json \
              webapp/packages/renderer/vite.config.mjs \
              webapp/packages/renderer/types/shims-vue.d.ts \
              webapp/packages/renderer/src/App.vue \
              webapp/packages/renderer/src/components/Alas.vue \
              webapp/packages/renderer/src/index.ts \
              webapp/packages/renderer/src/router.ts
            git add -- \
              webapp/package.json \
              webapp/pnpm-workspace.yaml \
              webapp/tsconfig.json \
              webapp/types/vite-env.d.ts \
              webapp/packages/renderer/index.html \
              webapp/packages/renderer/tsconfig.json \
              webapp/packages/renderer/vite.config.mjs \
              webapp/packages/renderer/types/shims-vue.d.ts \
              webapp/packages/renderer/src/App.vue \
              webapp/packages/renderer/src/components/Alas.vue \
              webapp/packages/renderer/src/index.ts \
              webapp/packages/renderer/src/router.ts
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo 'Unresolved upstream conflicts remain outside the protected UI files.'
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin HEAD:master
