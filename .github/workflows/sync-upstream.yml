name: Sync AzurPilot upstream

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch AzurPilot and ALAS upstreams
        run: |
          git remote add azurpilot-upstream https://github.com/wess09/AzurPilot.git
          git remote add alas-upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch --no-tags azurpilot-upstream master
          git fetch --no-tags alas-upstream master

      - name: Check whether ALAS is ahead
        run: |
          ahead=$(git rev-list --count --right-only --cherry-pick azurpilot-upstream/master...alas-upstream/master)
          {
            echo '## Upstream status'
            echo "- AzurPilot source: \`$(git rev-parse --short azurpilot-upstream/master)\`"
            echo "- ALAS source: \`$(git rev-parse --short alas-upstream/master)\`"
            echo "- ALAS patches not represented by AzurPilot: \`$ahead\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ahead" -gt 0 ]; then
            echo "::warning::ALAS has $ahead patch-equivalent commit(s) not represented by AzurPilot; no direct ALAS merge was performed."
          fi

      - name: Merge AzurPilot upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git merge-base --is-ancestor azurpilot-upstream/master HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'AzurPilot upstream is already represented by the deployment branch.'
            exit 0
          fi

          # Never choose a conflict side globally. A conflict must stop publication
          # so code and its tests cannot be combined from different implementations.
          git merge --no-edit azurpilot-upstream/master
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.merge.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        if: steps.merge.outputs.changed == 'true'
        run: uv sync

      - name: Validate merged WebUI lifecycle
        if: steps.merge.outputs.changed == 'true'
        run: |
          uv run ruff check module/webui/process_manager.py --select F821
          uv run python -m unittest \
            tests.test_process_manager \
            tests.test_webui_lifecycle \
            tests.test_webui_worker_registry

      - name: Publish validated deployment branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin HEAD:master
